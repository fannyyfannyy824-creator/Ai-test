<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Тест — Машинное обучение и перцептрон</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #25345c, transparent 35%),
                radial-gradient(circle at bottom right, #193c53, transparent 35%),
                #0b1020;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
        }

        .card {
            background: rgba(20, 28, 52, 0.94);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.35);
            backdrop-filter: blur(12px);
        }

        .hidden {
            display: none !important;
        }

        .logo {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            background: linear-gradient(135deg, #6c5ce7, #00cec9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        p {
            color: #c9d1e3;
            line-height: 1.6;
        }

        .subtitle {
            font-size: 18px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            width: 100%;
            padding: 17px 18px;
            border-radius: 14px;
            border: 1px solid #394665;
            background: #11182c;
            color: white;
            font-size: 17px;
            outline: none;
            margin-bottom: 15px;
        }

        input[type="text"]:focus {
            border-color: #6c5ce7;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #6c5ce7, #00b894);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .question-number {
            color: #8f9bb8;
            font-size: 15px;
        }

        .progress-wrapper {
            width: 100%;
            height: 8px;
            background: #202a45;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress {
            height: 100%;
            width: 20%;
            background: linear-gradient(90deg, #6c5ce7, #00cec9);
            transition: width 0.3s;
        }

        .question {
            font-size: 25px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 25px;
        }

        .answers {
            display: grid;
            gap: 14px;
        }

        .answer {
            padding: 18px;
            border-radius: 15px;
            border: 1px solid #37435f;
            background: #121a30;
            cursor: pointer;
            transition: 0.2s;
            font-size: 16px;
        }

        .answer:hover {
            border-color: #6c5ce7;
            background: #18213b;
        }

        .answer.selected {
            border-color: #00cec9;
            background: rgba(0,206,201,0.12);
        }

        .answer.correct {
            border-color: #00b894;
            background: rgba(0,184,148,0.18);
        }

        .answer.wrong {
            border-color: #e17055;
            background: rgba(225,112,85,0.18);
        }

        .next-btn {
            margin-top: 25px;
        }

        .result {
            text-align: center;
        }

        .score-circle {
            width: 170px;
            height: 170px;
            margin: 25px auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c5ce7, #00cec9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .score-number {
            font-size: 48px;
            font-weight: bold;
        }

        .score-text {
            color: #dfe6ff;
        }

        .result-message {
            font-size: 19px;
            margin-bottom: 25px;
        }

        .small {
            color: #7f8aa5;
            font-size: 14px;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 24px;
                border-radius: 20px;
            }

            h1 {
                font-size: 29px;
            }

            h2 {
                font-size: 24px;
            }

            .question {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- START -->
    <div class="card" id="startScreen">

        <div class="logo">🤖</div>

        <h1>Тест по ИИ</h1>

        <p class="subtitle">
            Машинное обучение и перцептроны
        </p>

        <p style="margin-bottom: 20px;">
            Пройди небольшой тест из 5 вопросов по презентации.
        </p>

        <input
            type="text"
            id="nameInput"
            placeholder="Введите ваше имя"
            maxlength="40"
        >

        <button onclick="startQuiz()">
            Начать тест
        </button>

        <div class="small">
            Тест содержит 5 вопросов • 1 балл за каждый правильный ответ
        </div>

    </div>


    <!-- QUIZ -->
    <div class="card hidden" id="quizScreen">

        <div class="topbar">
            <div class="question-number" id="questionNumber">
                Вопрос 1 из 5
            </div>

            <div class="question-number" id="playerName">
                Имя
            </div>
        </div>

        <div class="progress-wrapper">
            <div class="progress" id="progress"></div>
        </div>

        <div class="question" id="question"></div>

        <div class="answers" id="answers"></div>

        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
            Далее
        </button>

    </div>


    <!-- RESULT -->
    <div class="card hidden result" id="resultScreen">

        <div class="logo" style="margin-left:auto;margin-right:auto;">
            🏆
        </div>

        <h2>Тест завершён!</h2>

        <p id="resultName"></p>

        <div class="score-circle">

            <div class="score-number" id="scoreNumber">
                0/5
            </div>

            <div class="score-text">
                баллов
            </div>

        </div>

        <div class="result-message" id="resultMessage"></div>

        <button onclick="location.reload()">
            Пройти ещё раз
        </button>

    </div>

</div>


<script>

    // ============================================================
    // ВАЖНО:
    // После настройки Google Apps Script вставь сюда свою ссылку.
    // ============================================================

    const GOOGLE_SCRIPT_URL = "ВСТАВЬ_СЮДА_ССЫЛКУ_APPS_SCRIPT";


    const questions = [

        {
            question: "Что такое машинное обучение?",
            answers: [
                "Способ научить компьютер учиться на примерах",
                "Программа для рисования",
                "Способ ускорить интернет",
                "Обычный калькулятор"
            ],
            correct: 0
        },

        {
            question: "Кто пишет все правила в обычной программе?",
            answers: [
                "Сам компьютер",
                "Человек",
                "Перцептрон",
                "Интернет"
            ],
            correct: 1
        },

        {
            question: "Что такое перцептрон?",
            answers: [
                "Компьютерная игра",
                "Программа для создания сайтов",
                "Простая модель искусственного нейрона",
                "База данных"
            ],
            correct: 2
        },

        {
            question: "Что показывает вес признака в перцептроне?",
            answers: [
                "Размер файла",
                "Степень важности признака",
                "Скорость компьютера",
                "Количество вопросов"
            ],
            correct: 1
        },

        {
            question: "Что делает перцептрон, если его ответ оказался неправильным?",
            answers: [
                "Выключается",
                "Удаляет данные",
                "Изменяет веса",
                "Перезапускает компьютер"
            ],
            correct: 2
        }

    ];


    let currentQuestion = 0;
    let score = 0;
    let selectedAnswer = null;
    let userName = "";
    let userAnswers = [];


    function startQuiz() {

        const input = document.getElementById("nameInput");
        userName = input.value.trim();

        if (userName === "") {
            alert("Пожалуйста, введите ваше имя.");
            return;
        }

        currentQuestion = 0;
        score = 0;
        selectedAnswer = null;
        userAnswers = [];

        document.getElementById("startScreen").classList.add("hidden");
        document.getElementById("quizScreen").classList.remove("hidden");

        document.getElementById("playerName").textContent = userName;

        showQuestion();
    }


    function showQuestion() {

        const q = questions[currentQuestion];

        document.getElementById("questionNumber").textContent =
            `Вопрос ${currentQuestion + 1} из ${questions.length}`;

        document.getElementById("question").textContent = q.question;

        document.getElementById("progress").style.width =
            `${((currentQuestion + 1) / questions.length) * 100}%`;

        const answersContainer =
            document.getElementById("answers");

        answersContainer.innerHTML = "";

        selectedAnswer = null;

        document.getElementById("nextBtn").disabled = true;
        document.getElementById("nextBtn").style.opacity = "0.5";

        q.answers.forEach((answer, index) => {

            const div = document.createElement("div");

            div.className = "answer";
            div.textContent = answer;

            div.onclick = function() {

                document
                    .querySelectorAll(".answer")
                    .forEach(el => el.classList.remove("selected"));

                div.classList.add("selected");

                selectedAnswer = index;

                document.getElementById("nextBtn").disabled = false;
                document.getElementById("nextBtn").style.opacity = "1";
            };

            answersContainer.appendChild(div);
        });

        if (currentQuestion === questions.length - 1) {
            document.getElementById("nextBtn").textContent =
                "Завершить тест";
        } else {
            document.getElementById("nextBtn").textContent =
                "Далее";
        }
    }


    function nextQuestion() {

        if (selectedAnswer === null) {
            return;
        }

        const q = questions[currentQuestion];

        const isCorrect = selectedAnswer === q.correct;

        if (isCorrect) {
            score++;
        }

        userAnswers.push({
            question: currentQuestion + 1,
            answer: selectedAnswer,
            correct: isCorrect
        });

        if (currentQuestion < questions.length - 1) {

            currentQuestion++;
            showQuestion();

        } else {

            finishQuiz();

        }
    }


    function finishQuiz() {

        document.getElementById("quizScreen").classList.add("hidden");
        document.getElementById("resultScreen").classList.remove("hidden");

        document.getElementById("resultName").textContent =
            `${userName}, ваш результат:`;

        document.getElementById("scoreNumber").textContent =
            `${score}/5`;

        let message = "";

        if (score === 5) {
            message = "🔥 Отлично! Ты отлично понял тему.";
        }
        else if (score >= 4) {
            message = "👏 Очень хороший результат!";
        }
        else if (score >= 3) {
            message = "👍 Неплохо! Но можно ещё раз посмотреть презентацию.";
        }
        else if (score >= 2) {
            message = "📚 Стоит ещё раз повторить материал.";
        }
        else {
            message = "💡 Посмотри презентацию ещё раз и попробуй снова.";
        }

        document.getElementById("resultMessage").textContent =
            message;

        sendResult();
    }


    function sendResult() {

        if (
            !GOOGLE_SCRIPT_URL ||
            GOOGLE_SCRIPT_URL === "https://script.google.com/u/0/home/projects/1uQZ-9NIuiCZ9uWbTUymUypwO50RSX29bzZq0b-1B7z8uEm5OoH7cWWnQ/edit"
        ) {
            console.log("Google Apps Script ещё не подключён.");
            return;
        }

        const data = {

            name: userName,

            score: score,

            total: questions.length,

            percent: Math.round(
                (score / questions.length) * 100
            ),

            answers: userAnswers.map(x =>
                x.correct ? "Правильно" : "Неправильно"
            ).join(", ")

        };


        fetch(GOOGLE_SCRIPT_URL, {

            method: "POST",

            mode: "no-cors",

            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },

            body: JSON.stringify(data)

        })
        .then(() => {
            console.log("Результат отправлен.");
        })
        .catch(error => {
            console.error("Ошибка отправки:", error);
        });
    }

</script>

</body>
</html>
